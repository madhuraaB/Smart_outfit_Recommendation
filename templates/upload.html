<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Photo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-100 via-pink-100 to-yellow-100 min-h-screen">

    {% include 'navbar.html' %}

    <div class="max-w-lg mx-auto mt-16 bg-white p-8 rounded-2xl shadow-2xl">
        <h1 class="text-3xl font-bold text-purple-700 mb-4 text-center">Upload Your Photo</h1>
        
        {% if error %}
            <p class="text-red-500 text-center mb-4">{{ error }}</p>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            
            <!-- Upload Photo -->
            <div>
                <label class="block text-sm font-medium text-gray-700">
                    Full-body Photo (JPEG/PNG)
                    <span class="text-xs text-gray-500">(max 5MB)</span>
                </label>
                <input type="file" name="image" accept="image/*"
                    class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400" required>
            </div>

            <!-- Height Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Your Height (cm)</label>
                <input type="number" name="height" placeholder="e.g., 165"
                    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400" required>
            </div>

            <!-- Gender Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Select Gender</label>
                <select name="gender"
                    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400" required>
                    <option value="">-- Select Gender --</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-purple-700 text-white p-3 rounded-lg hover:bg-purple-800 transition">
                Analyze & Recommend
            </button>
        </form>

        <p class="text-xs text-gray-500 mt-3 text-center">
            💡 Tip: Stand straight, wear fitted clothing, capture full body in frame for best results.
        </p>
    </div>

</body>
</html>
